---
# glint.yaml — generated by `glint init`
# Detected: plain Kubernetes manifests
version: "v1alpha1"

discovery:
  paths: ["."]
  exclude:
    - "vendor/**"
    - "**/.git/**"
    - "**/.terraform/**"
    - "**/.ansible/**"
    - "**/.venv/**"

render:
  helm:
    kubernetes_version: "1.37.1" # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet extractVersion=^v(?<version>.+)$ versioning=semver
    include_crds: true
  subprocess_fallback: false

rules:
  built_in:
    no_latest_tag:
      enabled: true
      severity: error
    resource_requests:
      enabled: false
      severity: warning
    deprecated_apis:
      enabled: true
      severity: error

  # Custom CEL rules — add your own policies here:
  custom: []

  # Load rules from additional files:
  # rule_files:
  #   - "glint-rules/*.yaml"

output:
  format: text
  color: auto
  summary: true

fail_on:
  - error
