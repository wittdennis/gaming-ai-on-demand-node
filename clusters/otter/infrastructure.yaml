---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  wait: true
  timeout: 5m
  # On a first bootstrap the ClusterSecretStore applies before the ESO chart has installed its
  # CRDs, so this fails once and converges on the retry. Short enough that it is not noticed.
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: jotunheim
