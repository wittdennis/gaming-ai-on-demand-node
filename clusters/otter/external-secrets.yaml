---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/external-secrets
  prune: true
  # Everything downstream waits on this: ExternalSecret and ClusterSecretStore are CRDs this
  # release installs, and applying one before they exist deadlocks kustomize-controller.
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: jotunheim
