---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rbac
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/rbac
  prune: true
  wait: true
  timeout: 5m
  # No dependsOn: human access to the API must not be gated on ESO or any workload being healthy,
  # since a broken cluster is exactly when it is needed.
  sourceRef:
    kind: GitRepository
    name: jotunheim
