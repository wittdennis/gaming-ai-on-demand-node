---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/controllers
  prune: true
  # Readiness here is what the configs stage waits on: it must not run until the CRDs the
  # controllers install actually exist.
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: jotunheim
