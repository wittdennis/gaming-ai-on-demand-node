# code: language=ini
[defaults]
# External Galaxy roles/collections install into the repo-local, gitignored .ansible/ cache
# (via `ansible-galaxy install -r requirements.yml`, run by hack/setup-venv.sh) - nothing here
# depends on ~/.ansible. .ansible/roles is listed first so `ansible-galaxy install` (no -p
# flag) installs there, not into a git-tracked roles/ dir.
roles_path = .ansible/roles:ansible/roles
collections_path = .ansible/collections

# One machine, one inventory: the playbooks are run on otter itself against localhost, so
# naming it on every invocation would be ceremony with no choice behind it.
inventory = ansible/inventories/localhost
