---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
buildMetadata: [originAnnotations]
# stores/ is deliberately absent: its ClusterSecretStore needs CRDs this release installs, so a
# separate Flux Kustomization applies it afterwards.
resources:
  - namespace.yaml
  - helm-repository.fluxcd.yaml
  - helm-release.fluxcd.yaml
