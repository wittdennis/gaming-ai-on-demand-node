---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-otter
spec:
  provider:
    vault:
      server: "https://vault.derwitt.site"
      path: "otter"
      version: "v2"
      auth:
        jwt:
          path: jwt-otter
          role: eso-otter
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: eso-otter
              namespace: external-secrets
              audiences:
                - https://vault.derwitt.site
