---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-metrics-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: device-metrics-exporter-charts
      version: v1.5.1
      sourceRef:
        kind: HelmRepository
        name: device-metrics-exporter
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: docker.io/rocm/device-metrics-exporter
      pullPolicy: IfNotPresent
      initContainerImage: docker.io/library/busybox:1.36.1 # renovate
    # No Prometheus operator here, so the CRD this would render does not exist.
    serviceMonitor:
      enabled: false
    service:
      type: ClusterIP
    # The chart asks for 2 CPU and 4Gi by default, which is a fleet-sized default for a
    # process that reads counters off one card.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
