---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mogenius-operator-dev-valkey-credentials
  namespace: mogenius-operator-dev
spec:
  refreshInterval: "1h0m0s"
  secretStoreRef:
    name: vault-backend-otter
    kind: ClusterSecretStore
  target:
    name: mogenius-operator-dev-valkey-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /mogenius-operator-dev/valkey/credentials
        property: default-password
      secretKey: default-password
