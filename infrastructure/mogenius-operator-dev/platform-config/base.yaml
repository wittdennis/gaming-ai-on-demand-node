---
apiVersion: mogenius.com/v1alpha1
kind: PlatformConfig
metadata:
  name: "ai-platform-dev"
spec:
  gitOps:
    repositories:
      - name: jotunheim
        url: https://git.derwitt.site/homelab/jotunheim.git
        revision: main
        write:
          enabled: true
          mode: PULL_REQUEST
          secretRef:
            secret:
              name: gitops-write-token
              key: jotunheim-write-token
          provider: GITEA
