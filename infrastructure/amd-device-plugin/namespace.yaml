---
apiVersion: v1
kind: Namespace
metadata:
  name: amd-device-plugin
  labels:
    # The plugin DaemonSet mounts hostPaths (/dev, /sys, the kubelet device-plugin socket),
    # which `baseline` forbids. Only this namespace is privileged; workload pods stay
    # `restricted` and reach the GPU through the amd.com/gpu resource it advertises.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
