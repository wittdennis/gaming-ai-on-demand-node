---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-device-plugin
  namespace: amd-device-plugin
spec:
  interval: 1h
  chart:
    spec:
      chart: amd-gpu
      version: 0.21.0
      sourceRef:
        kind: HelmRepository
        name: amd-device-plugin
        namespace: amd-device-plugin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    dp:
      image:
        repository: docker.io/rocm/k8s-device-plugin
    nfd:
      enabled: false
    node_selector_enabled: true
    labeller:
      enabled: true
    lbl:
      image:
        repository: docker.io/rocm/k8s-device-plugin
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
