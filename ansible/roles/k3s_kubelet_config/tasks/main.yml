---
# k3s merges every file in this directory into the kubelet config at startup, which is the
# only way left to reach KubeletConfiguration fields that have no matching CLI flag.
- name: Create kubelet config drop-in directory
  become: true
  ansible.builtin.file:
    path: "{{ k3s_kubelet_config_dir }}"
    state: directory
    mode: "0755"

- name: Write graceful shutdown kubelet config
  become: true
  ansible.builtin.template:
    src: graceful-shutdown.yaml.j2
    dest: "{{ k3s_kubelet_config_dir }}/graceful-shutdown.yaml"
    mode: "0644"
  notify: Restart k3s for kubelet config
