---
# Written by the k3s role for the ansible user (user_kubectl), and read by both the flux CLI and
# kubernetes.core via KUBECONFIG.
#
# Resolved with a lookup rather than ansible_facts: this is consumed by a play-level
# `environment:`, which is templated for every task including the implicit fact gathering - so at
# that point ansible_facts is not populated yet. A lookup runs on the controller, which is the
# same machine and the same user, because these playbooks run on otter itself.
kubeconfig_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/localhost/config"
