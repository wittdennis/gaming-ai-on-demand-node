# code: language=ansible
---
- name: K3s bootstrap
  hosts: all
  force_handlers: true
  tasks:
    - name: Disable swap for current session
      become: true
      ansible.builtin.command:
        cmd: swapoff -a
      changed_when: false

    - name: Disable swap permanently, persist reboots
      become: true
      when: ansible_facts['swaptotal_mb'] > 0
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*)([^#\n]+\s+)(\w+\s+)swap(\s+.*)$'
        replace: '#\1\2\3swap\4'
        backup: true

- name: Install k3s
  tags: [k3s]
  ansible.builtin.import_playbook: k3s.orchestration.site

# Runs after the site playbook rather than folded into k3s.yml's server_config_yaml: the
# settings this writes are KubeletConfiguration fields, not kube-apiserver-arg-style CLI flags,
# so they cannot go through kubelet-arg and have to land in k3s's own kubelet.conf.d directory
# instead.
- name: Configure kubelet
  hosts: k3s_cluster
  tags: [k3s]
  gather_facts: false
  become: true
  roles:
    - role: k3s_kubelet_config
