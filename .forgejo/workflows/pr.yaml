---
name: lint

permissions: {}

on:
  pull_request:
    branches:
      - main
      - release/**

jobs:
  yamllint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup uv
        uses: https://git.derwitt.site/actions/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: install yamllint
        run: |
          uv tool install yamllint@${YAMLLINT_VERSION}
          uv tool list
        env:
          YAMLLINT_VERSION: 1.38.0 # datasource=pypi depName=yamllint packageName=yamllint versioning=semver

      - name: lint
        run: |
          yamllint -c .yamllint .

  ansible-lint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup uv
        uses: https://git.derwitt.site/actions/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: lint
        uses: https://git.derwitt.site/actions/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # v26.10.1
        with:
          requirements_file: requirements.yml

  glint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint
        uses: https://git.derwitt.site/actions/glint@cd3deea01f61d5ca55e56849a432f4e1805f2270 # v0.2.9
        with:
          format: text
          sarif-file: ""
