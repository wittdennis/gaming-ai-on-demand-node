---
name: lint

permissions: {}

on:
  pull_request:
    branches:
      - main
      - release/**

jobs:
  yamllint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup uv
        uses: https://git.derwitt.site/actions/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: install yamllint
        run: |
          uv tool install yamllint@${YAMLLINT_VERSION}
          uv tool list
        env:
          YAMLLINT_VERSION: 1.38.0 # datasource=pypi depName=yamllint packageName=yamllint versioning=semver

      - name: lint
        run: |
          yamllint -c .yamllint .

  ansible-lint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup uv
        uses: https://git.derwitt.site/actions/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: lint
        uses: https://git.derwitt.site/actions/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # v26.10.1
        with:
          requirements_file: requirements.yml

  glint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint
        uses: https://git.derwitt.site/actions/glint@7d7741356fef290bdcf866079326f6ce7d31b719 # v0.2.8
        with:
          format: text
          sarif-file: ""
