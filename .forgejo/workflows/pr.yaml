---
name: lint

permissions: {}

on:
  pull_request:
    branches:
      - main
      - release/**

jobs:
  yamllint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup uv
        uses: https://git.derwitt.site/actions/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: install yamllint
        run: |
          uv tool install yamllint@${YAMLLINT_VERSION}
          uv tool list
        env:
          YAMLLINT_VERSION: 1.38.0 # datasource=pypi depName=yamllint packageName=yamllint versioning=semver

      - name: lint
        run: |
          yamllint -c .yamllint .

  ansible-lint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup uv
        uses: https://git.derwitt.site/actions/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: lint
        uses: https://git.derwitt.site/actions/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
        with:
          requirements_file: requirements.yml

  glint:
    runs-on: debian-13
    permissions:
      contents: read
    steps:
      - uses: https://git.derwitt.site/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint
        uses: https://git.derwitt.site/actions/glint@72669d88710d42ed0066b9bf32db542b58351160 # v0.3.1
        with:
          format: text
          sarif-file: ""
