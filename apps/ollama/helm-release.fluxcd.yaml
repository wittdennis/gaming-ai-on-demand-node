---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ai-platform
spec:
  interval: 1h
  chart:
    spec:
      chart: ollama
      version: 1.74.0
      sourceRef:
        kind: HelmRepository
        name: otwld
        namespace: ai-platform
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      # image.tag is deliberately unset: with gpu.type amd the chart appends the `-rocm`
      # suffix to the chart's appVersion, and overriding the tag disables that.
      repository: docker.io/ollama/ollama

    ollama:
      mountPath: /data
      # The chart's own GPU helper handles AMD directly, rendering an amd.com/gpu limit, so the
      # resource request needs no manual plumbing here.
      #
      # The node advertises two AMD GPUs, the discrete card and the CPU's iGPU, and kubelet
      # gives no ordering guarantee about which one a request for a single device gets.
      # Claiming both keeps the discrete card in the set; ROCR_VISIBLE_DEVICES below decides
      # which is used. The claim is bookkeeping, so the desktop keeps both either way.
      gpu:
        enabled: true
        type: amd
        number: 2
      models:
        pull:
          - qwen3-coder:30b
          - qwen3.6:27b

    extraEnv:
      # The 7900 XTX by KFD unique id, so it survives a reordering of device indices. The iGPU
      # reports an id of 0x0 and cannot be addressed this way, which is fine: it is the one
      # being excluded.
      - name: ROCR_VISIBLE_DEVICES
        value: "GPU-0f8c49f6b81ea5b0"
      # Left unset, this is chosen from whatever VRAM happens to be free at load time, so the
      # context would shrink silently on a day the desktop is holding more. 32k is the largest
      # value both models keep entirely on the GPU at full speed; 64k costs a partial spill.
      # Callers wanting more can raise num_ctx per request and take that trade knowingly.
      - name: OLLAMA_CONTEXT_LENGTH
        value: "32768"
      # Weights leave VRAM shortly after idle, so a game launched later is not fighting for
      # memory that nothing is using.
      - name: OLLAMA_KEEP_ALIVE
        value: "5m"
      - name: OLLAMA_FLASH_ATTENTION
        value: "1"
      - name: HOME
        value: /data

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        # Above the 24 GB of VRAM: host RAM mirrors model buffers and the KV cache, and a
        # tighter limit makes ollama disable mmap under memory pressure.
        memory: 32Gi

    persistentVolume:
      enabled: true
      size: 200Gi
      # k3s default provisioner; the local SSD is the point, this tier is not portable.
      storageClass: local-path
      accessModes:
        - ReadWriteOnce

    # RWO volume, so the old pod must go before the new one starts.
    updateStrategy:
      type: Recreate
