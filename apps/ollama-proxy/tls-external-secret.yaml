---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ollama-proxy-tls
  namespace: ai-platform
spec:
  # Shorter than the other secrets here: this is the path a renewed certificate travels, and
  # the pod picks up a rotation on its next start.
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend-otter
    kind: ClusterSecretStore
  target:
    name: ollama-proxy-tls
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - remoteRef:
        conversionStrategy: Default
        key: /ollama-proxy/tls
        property: tls.crt
      secretKey: tls.crt
    - remoteRef:
        conversionStrategy: Default
        key: /ollama-proxy/tls
        property: tls.key
      secretKey: tls.key
