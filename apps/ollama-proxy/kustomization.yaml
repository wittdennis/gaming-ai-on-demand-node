---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
buildMetadata: [originAnnotations]
resources:
  - external-secret.yaml
  - deployment.yaml
  - service.yaml

# Generated rather than written out: the name gets a content hash, so editing the Caddyfile
# rolls the Deployment instead of leaving it on the old config until something else restarts it.
configMapGenerator:
  - name: ollama-proxy-caddyfile
    namespace: ai-platform
    files:
      - Caddyfile
