---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-proxy
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ollama-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: docker.io/library/caddy:2.11.4-alpine # renovate
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Read once at startup, since Caddy substitutes it while parsing: rotating the
            # token in Vault needs a pod restart to take effect.
            - name: OLLAMA_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ollama-proxy-token
                  key: token
            # Caddy writes its state under these; both point at writable emptyDirs so the
            # root filesystem can stay read-only.
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /config
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: caddyfile
          configMap:
            name: ollama-proxy-caddyfile
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
